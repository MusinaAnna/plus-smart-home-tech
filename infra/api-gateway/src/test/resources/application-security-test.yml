spring:
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
    gateway:
      discovery:
        locator:
          enabled: false
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origins:
              - http://localhost:8443
            allowed-methods:
              - GET
              - POST
              - PATCH
              - OPTIONS
            allowed-headers:
              - '*'
            allow-credentials: true
      routes:
        - id: security-test-backend
          uri: forward:/__security_test_backend
          predicates:
            - Path=/api/**

eureka:
  client:
    enabled: false

app:
  security:
    users:
      - username: ivan
        password: ivan
        roles:
          - USER
      - username: anna
        password: anna
        roles:
          - USER
          - ADMIN
